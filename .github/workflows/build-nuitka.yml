name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"   # ví dụ: v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ⚡ Cache toàn bộ toolchain (rất quan trọng)
    - name: Cache Nuitka & MinGW
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\Nuitka
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install -r requirements.txt

    # 🚀 Build exe
    - name: Build EXE
      run: |
        python -m nuitka ^
          --assume-yes-for-downloads ^
          --mingw64 ^
          --onefile ^
          --enable-plugin=pyside6 ^
          --windows-console-mode=disable ^
          --windows-icon-from-ico=logo.ico ^
          --jobs=%NUMBER_OF_PROCESSORS% ^
          --lto=yes ^
          --remove-output ^
          main.py

    # 🔧 Rename cho chuyên nghiệp
    - name: Rename file
      run: |
        ren main.exe Tool_BangGia_Pro.exe

    # 📦 Upload artifact (debug / download nhanh)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tool_BangGia_Pro
        path: Tool_BangGia_Pro.exe

    # 🚀 Auto tạo release + attach file
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: Tool_BangGia_Pro.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
