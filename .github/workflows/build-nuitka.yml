name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"   # ví dụ: v1.0.0
  workflow_dispatch:

# BỔ SUNG QUYỀN GHI ĐỂ TẠO RELEASE
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Dùng dấu gạch chéo xuôi (/) cho đường dẫn để tránh lỗi trên runner
    - name: Cache Nuitka & MinGW
      uses: actions/cache@v4
      with:
        path: |
          ~/AppData/Local/Nuitka
          ~/AppData/Local/pip/Cache
        key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install -r requirements.txt

    # Tối ưu lệnh Build: Bỏ --lto=yes, thêm --output-filename
    - name: Build EXE
      shell: cmd
      run: |
        python -m nuitka ^
          --assume-yes-for-downloads ^
          --mingw64 ^
          --onefile ^
          --enable-plugin=pyside6 ^
          --windows-console-mode=disable ^
          --windows-icon-from-ico=logo.ico ^
          --output-filename=Tool_BangGia_Pro.exe ^
          --jobs=%NUMBER_OF_PROCESSORS% ^
          --remove-output ^
          main.py

    # Bỏ bước Rename vì Nuitka đã tự đặt tên file

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tool_BangGia_Pro
        path: Tool_BangGia_Pro.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: Tool_BangGia_Pro.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
